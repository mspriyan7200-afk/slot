<html>
    <head>
        <title>medical form</title>
    </head>
    <body>
        <h1>PATIENT FORM</h1>
        <h2><b>HOSPITAL REGISTRATION FORM</b></h2>
        <h3>Patients are required to register their information on this form</h3>
        <form>
            <label>Registration check id</label>
            <input type="text">
            <br>
            <br>
            <label>Healyh care number*</label>
            <input type="number" required>
            <br>
            <br>
            <label>Registration Location ex: ER, Clinic, etc</label>
            <input type="text" >
            <br>
            <br>
            <label>Registration Date*</label>
            <input type="date" required>
            <br>
            <br>
            <label>Registration Time*</label>
            <input type="time" required>
            <br>
            <br>
            <label>Address</label>
            <textarea rows="4" cols="20"></textarea>
            <br>
            <br>
            <select>
                <option>country</option>
                <option>India</option>
                <option>China</option>
                <option>Japan</option>
            </select>
            <label>Phone Number</label>
            <input type="number">
            <br>
            <br>
            <label>Email</label>
            <input type="email">
            <br>
            <br>
            <label>Date of birth</label>
            <input type="date">
            <br>
            <br>
            <label>sex*</label>
            <input type="radio" name="y">Male
            <input type="radio" name="y">Female
            <br>
            <br>
            <label>Marital status</label>
            <select>
                <option >single</option>
                <option >married</option>
                <option >divorced</option>
                <option >widowed</option>
                <option >separated</option>
            </select>
            <br>
            <br>
            <input type="submit" value="NEXT" align="center">
        </form>
        
    </body>
</html>
